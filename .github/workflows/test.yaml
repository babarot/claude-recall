name: Test

# On main, Release runs this before it releases
on:
  pull_request:
    # What tagpr's pull request changes, released only once this passes on
    # main; its runs wait for an approval anyway, made with GITHUB_TOKEN
    paths-ignore:
      - CHANGELOG.md
      - internal/version/version.go
      - plugin/.claude-plugin/plugin.json
  workflow_call:

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - run: cd ui && npm ci && npm test && npm run build
      # The release build embeds the UI; make sure that build compiles
      - run: rm -rf internal/webui/dist && cp -R ui/dist internal/webui/dist
      - run: go build -tags embedui ./cmd/recall
